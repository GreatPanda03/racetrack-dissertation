<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Track Builder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../styles/main.css">
    <script src="../scripts/track-builder.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
</head>

<body>
    <div id="div-main">
        <h1 id="page-title"><b>Track Builder</b></h1>
        <hr/>
        
        <div id="options">
            <div>
                <b>Options</b>
            </div>
            <div>
                <a href="../pages/main-menu.html">
                    <button id="options-home" class="btn btn-primary">
                        <i class="bi bi-house-door-fill"></i>
                        <br/>Home
                    </button>
                </a>
                
                <button id="options-details" class="btn btn-primary">
                    <i class="bi bi-house-door-fill"></i>
                    <br/>Details
                </button>
                
                <button id="options-save" class="btn btn-primary">
                    <i class="bi bi-house-door-fill"></i>
                    <br/>Save
                </button>
                
                <button id="options-save-as" class="btn btn-primary">
                    <i class="bi bi-house-door-fill"></i>
                    <br/>Save As
                </button>

                <button id="options-undo" class="btn btn-primary">
                    <i class="bi bi-house-door-fill"></i>
                    <br/>Undo
                </button>

                <button id="options-redo" class="btn btn-primary">
                    <i class="bi bi-house-door-fill"></i>
                    <br/>Redo
                </button>

                <button id="options-test" class="btn btn-primary">
                    <i class="bi bi-house-door-fill"></i>
                    <br/>Test
                </button>

                <button id="options-import" class="btn btn-primary">
                    <i class="bi bi-house-door-fill"></i>
                    <br/>Import
                </button>

                <button id="options-export" class="btn btn-primary">
                    <i class="bi bi-house-door-fill"></i>
                    <br/>Export
                </button>
            </div>
        </div>
        <br/>

        <div options="tools">
            <div>
                <b>Tools</b>
            </div>
            </div>
                <button id="tools-path" class="btn btn-primary">
                    <i class="bi bi-house-door-fill"></i>
                    <br/>Path
                </button>

                <button id="tools-material" class="btn btn-primary">
                    <i class="bi bi-house-door-fill"></i>
                    <br/>Material
                </button>

                <button id="tools-obstacle" class="btn btn-primary">
                    <i class="bi bi-house-door-fill"></i>
                    <br/>Obstacle
                </button>

                <button id="tools-decoration" class="btn btn-primary">
                    <i class="bi bi-house-door-fill"></i>
                    <br/>Decoration
                </button>
            </div>
        </div>
        <br/>

        <div>
            <div>
                <b>Builder</b>
            </div>
            <canvas id="canvas" width="759" height="750" style="border:1px solid #000000;"></canvas>

            <!-- secondary canvas for grid? -->
        </div>
    </div>
</body>
</html>
